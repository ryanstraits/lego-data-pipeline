name: Monthly LEGO data refresh


on:
  schedule:
    # Runs at 09:00 UTC on the 1st of every month.
    # Adjust as you like -- cron is (minute hour day month weekday).
    - cron: "0 9 1 * *"
  workflow_dispatch: {}  # lets you trigger it manually from the Actions tab

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Pull new sets/figs from Rebrickable
        working-directory: scripts
        run: python fetch_rebrickable_bulk.py
        env:
          REBRICKABLE_API_KEY: ${{ secrets.REBRICKABLE_API_KEY }}

      - name: Resolve new figs to BrickLink IDs
        working-directory: scripts
        run: python update_fig_mapping.py
        env:
          REBRICKABLE_API_KEY: ${{ secrets.REBRICKABLE_API_KEY }}

      - name: Refresh BrickLink price data
        working-directory: scripts
        run: python fetch_bricklink_prices.py
        env:
          BRICKLINK_CONSUMER_KEY: ${{ secrets.BRICKLINK_CONSUMER_KEY }}
          BRICKLINK_CONSUMER_SECRET: ${{ secrets.BRICKLINK_CONSUMER_SECRET }}
          BRICKLINK_TOKEN_VALUE: ${{ secrets.BRICKLINK_TOKEN_VALUE }}
          BRICKLINK_TOKEN_SECRET: ${{ secrets.BRICKLINK_TOKEN_SECRET }}

      - name: Clean up scratch files
        run: rm -f data/_new_sets.csv data/_new_rebrickable_figs.csv

      - name: Commit updated data files
        run: |
          git config user.name "lego-data-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "Monthly data refresh: $(date -u +%Y-%m-%d)"
          git push
